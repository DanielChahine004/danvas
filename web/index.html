<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>danvas</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
  #dv-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; color: #94a3b8; font: 600 13px/1.4 system-ui, -apple-system, sans-serif;
    padding: 0 16px; text-align: center; }
  #dv-boot .ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(148,163,184,.25);
    border-top-color: #3b82f6; animation: dv-spin .8s linear infinite; }
  #dv-boot.err .ring { display: none; }
  #dv-boot.err { color: #fca5a5; }
  #dv-boot.ask .ring { display: none; }
  #dv-boot form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #dv-boot input { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; width: min(320px, 80vw); }
  #dv-boot button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 0; background: #3b82f6; color: white; cursor: pointer; }
  #dv-status { position: fixed; right: 12px; top: 10px; z-index: 99999; font: 500 11px system-ui, sans-serif;
    color: #94a3b8; background: rgba(15,23,42,.75); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  #dv-boot.ask { color: #cbd5e1; font-weight: 500; max-width: 460px; margin: 0 auto; }
  #dv-boot .dv-title { font-size: 18px; font-weight: 700; color: #f1f5f9; }
  #dv-boot a { color: #93c5fd; }
  #dv-boot .dv-auth { color: #94a3b8; font-size: 13px; font-weight: 500; }
  #dv-boot button.dv-link { background: none; padding: 0; color: #93c5fd; text-decoration: underline; }
  #dv-boot .dv-recent { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #dv-boot .dv-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #64748b; }
  #dv-repo-link { position: fixed; right: 12px; bottom: 12px; z-index: 99999; font: 500 11px system-ui, sans-serif;
    color: #94a3b8; background: rgba(15,23,42,.8); padding: 5px 9px; border-radius: 6px; text-decoration: none; }
  #dv-repo-link:hover { color: #e2e8f0; }
  #dv-repo-link b { font-weight: 600; color: #cbd5e1; }
  #dv-notes { position: fixed; left: 50%; transform: translateX(-50%); top: 56px; z-index: 99999; display: flex;
    flex-direction: column; align-items: center; gap: 6px; width: max-content;
    max-width: min(420px, calc(100vw - 24px)); font: 500 12px/1.4 system-ui, sans-serif; }
  #dv-notes > div { color: #cbd5e1; background: rgba(15,23,42,.9); border: 1px solid #334155; padding: 7px 28px 7px 10px;
    border-radius: 8px; position: relative; }
  #dv-notes a, #dv-notes button.dv-act { color: #93c5fd; background: none; border: 0; padding: 0; font: inherit;
    text-decoration: underline; cursor: pointer; }
  #dv-notes button.dv-x { position: absolute; top: 3px; right: 6px; background: none; border: 0; color: #64748b;
    font: 16px/1 system-ui, sans-serif; cursor: pointer; padding: 2px; }
  #dv-notes button.dv-x:hover { color: #e2e8f0; }
  @keyframes dv-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"><div id="dv-boot"><div class="ring"></div><div id="dv-msg">Starting…</div></div></div>
<div id="dv-status" hidden></div>
<div id="dv-notes"></div>
<a id="dv-repo-link" href="./" hidden title="Open another repository"><b></b> · open another</a>
<script type="module" src="./boot.js"></script>
</body>
</html>
