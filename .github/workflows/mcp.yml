name: MCP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run typecheck && npm run build
        working-directory: danvas/frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: broker
      - run: cargo build --release --locked --manifest-path broker/Cargo.toml
      - run: python -m pip install -e '.[mcp,mcp-test]' httpx
      - run: python -m playwright install --with-deps chromium
      - run: ruff check --isolated --select E4,E7,E9,F,I danvas/_mcp_service.py danvas/mcp_server.py tests/mcp
      - run: mypy --follow-imports=silent --ignore-missing-imports danvas/_mcp_service.py danvas/mcp_server.py
      - run: pytest tests/mcp -q
        env:
          DANVASD: ${{ github.workspace }}/broker/target/release/danvasd
          DANVAS_MCP_EVIDENCE: ${{ runner.temp }}/danvas-mcp-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/danvas-mcp-evidence
